name: MagicBlockPlus
version: '1.0.0'
main: io.github.niubikelashi.magicblockplus.MagicBlockPlusPlugin
api-version: '1.20'
authors: [niubikelashi]
description: 有限次数的魔法方块：兼容 1.20.1+，修复方块莫名其妙消失与刷方块；GUI 只收录常见建筑方块并全量汉化。
softdepend: [PlaceholderAPI]
folia-supported: false

commands:
  magicblock:
    description: MagicBlockPlus 主命令
    aliases: [mb, mbp]
    usage: /<command> <子命令> [参数]
    permission: magicblock.use

permissions:
  magicblock.use:
    description: 放置与使用魔法方块，打开选择界面
    default: true
  magicblock.break:
    description: 破坏魔法方块
    default: true
  magicblock.breakprotected:
    description: 破坏别人的魔法方块时绕过归属限制
    default: op
  magicblock.gui:
    description: 打开建筑方块选择界面
    default: true
  magicblock.get:
    description: 给自己一个魔法方块
    default: op
  magicblock.give:
    description: 给别的玩家一个魔法方块
    default: op
  magicblock.food:
    description: 给出魔法食物物品
    default: op
  magicblock.list:
    description: 查看自己绑定/保存的魔法方块
    default: true
  magicblock.retrieve:
    description: 从列表里取回保存的方块
    default: true
  magicblock.reload:
    description: 重新读取配置
    default: op
  magicblock.settimes:
    description: 设置或增加方块次数
    default: op
  magicblock.stats:
    description: 查看插件统计
    default: op
  magicblock.admin:
    description: MagicBlockPlus 全部命令
    default: op
    children:
      magicblock.use: true
      magicblock.break: true
      magicblock.breakprotected: true
      magicblock.gui: true
      magicblock.get: true
      magicblock.give: true
      magicblock.food: true
      magicblock.list: true
      magicblock.retrieve: true
      magicblock.reload: true
      magicblock.settimes: true
      magicblock.stats: true
