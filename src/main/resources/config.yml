# MagicBlockPlus 配置（全部中文）
# 说明都写在旁边，改完用 /mb reload 生效，不用重启服务器。

# 消息前缀（支持 & 颜色码）
prefix: "&7[MagicBlockPlus] "

# 语言：zh_CN（默认，全量汉化）或 en
language: zh_CN

# ------------------------------------------------------------------
# 建筑方块目录
# ------------------------------------------------------------------
building-blocks:
  # 只把「建筑方块」放进 GUI；关掉后就只认下面 gui.materials 里手写的材料
  enabled: true
  # 随版本更新自动发现新的建筑方块（新木种、新砖瓦、新陶瓦颜色都会自动进来）
  auto-add: true
  # 自动发现的数量上限（超过就停，避免 GUI 无限膨胀；调小可以让界面更精简）
  auto-max: 600
  # GUI 物品 lore 里显示所属类别
  show-category: true

  # 自动发现的「包含」规则：命中任意一条才算建筑方块（正则，匹配材料枚举名）
  include:
    - "^.*_PLANKS$"        # 木板
    - "^.*_STAIRS$"        # 楼梯
    - "^.*_SLAB$"          # 台阶
    - "^.*_WALL$"          # 墙
    - "^.*_FENCE$"         # 栅栏
    - "^.*_FENCE_GATE$"    # 栅栏门
    - "^.*_TRAPDOOR$"      # 活板门
    - "^.*_BRICKS$"        # 砖
    - "^.*_TILES$"         # 瓦
    - "^.*_PILLAR$"        # 柱石
    - "^.*_MOSAIC$"        # 拼花（竹片块之类）
    - "^.*_WOOD$"          # 木头
    - "^.*_LOG$"           # 原木（含去皮原木）
    - "^.*_BLOCK$"         # 各类方块（草方块、雪块、苔藓块、金属块…）
    - "^.*_HYPHAE$"        # 菌丝
    - "^.*_STEM$"          # 菌杆
    - "^.*_GLASS$"         # 玻璃
    - "^.*_GLASS_PANE$"    # 玻璃板
    - "^.*_WOOL$"          # 羊毛
    - "^.*_CARPET$"        # 地毯
    - "^.*_CONCRETE$"      # 混凝土
    - "^.*_TERRACOTTA$"    # 陶瓦
    - "^BRICKS$"           # 砖块
    - "^STONE$"            # 石头
    - "^COBBLESTONE$"      # 圆石
    - "^MOSSY_COBBLESTONE$"
    - "^GRANITE$"
    - "^POLISHED_GRANITE$"
    - "^DIORITE$"
    - "^POLISHED_DIORITE$"
    - "^ANDESITE$"
    - "^POLISHED_ANDESITE$"
    - "^DEEPSLATE$"
    - "^COBBLED_DEEPSLATE$"
    - "^POLISHED_DEEPSLATE$"
    - "^TUFF$"             # 凝灰岩
    - "^CALCITE$"          # 方解石
    - "^SANDSTONE$"
    - "^RED_SANDSTONE$"
    - "^SMOOTH_SANDSTONE$"
    - "^SMOOTH_RED_SANDSTONE$"
    - "^STONE_BRICKS$"
    - "^MOSSY_STONE_BRICKS$"
    - "^DIRT$"
    - "^COARSE_DIRT$"
    - "^ROOTED_DIRT$"
    - "^CLAY$"
    - "^MUD$"
    - "^PACKED_MUD$"
    - "^MUD_BRICKS$"
    - "^SAND$"
    - "^GRAVEL$"
    - "^SOUL_SAND$"
    - "^SOUL_SOIL$"
    - "^NETHERRACK$"
    - "^OBSIDIAN$"
    - "^COPPER_BLOCK$"
    - "^GLOWSTONE$"
    - "^SEA_LANTERN$"
    - "^BONE_BLOCK$"
    - "^PRISMARINE$"
    - "^PRISMARINE_BRICKS$"
    - "^END_STONE$"
    - "^NETHER_BRICKS$"

  # 「奇怪方块」排除名单：命中任意一条就绝不进目录
  exclude:
    - "^AIR$"
    - "^CAVE_AIR$"
    - "^VOID_AIR$"
    - "^.*_CHEST$"           # 箱子 / 陷阱箱
    - "^TRAPPED_CHEST$"
    - "^BARREL$"
    - "^ENDER_CHEST$"
    - "^.*_SHULKER_BOX$"
    - "^FURNACE$"            # 熔炉类
    - "^BLAST_FURNACE$"
    - "^SMOKER$"
    - "^CRAFTING_TABLE$"
    - "^ENCHANTING_TABLE$"
    - "^CARTOGRAPHY_TABLE$"
    - "^FLETCHING_TABLE$"
    - "^GRINDSTONE$"
    - "^STONECUTTER$"
    - "^SMITHING_TABLE$"
    - "^LOOM$"
    - "^LECTERN$"
    - "^ANVIL$"
    - "^.*_ANVIL$"
    - "^BEACON$"
    - "^BELL$"
    - "^CAKE$"
    - "^HOPPER$"             # 红石机械
    - "^OBSERVER$"
    - "^DISPENSER$"
    - "^DROPPER$"
    - "^JUKEBOX$"
    - "^NOTE_BLOCK$"
    - "^COMPOSTER$"
    - "^RESPAWN_ANCHOR$"
    - "^.*_SPAWNER$"
    - "^SPAWNER$"
    - "^REDSTONE_TORCH$"
    - "^REDSTONE_WALL_TORCH$"
    - "^REDSTONE_WIRE$"
    - "^REPEATER$"
    - "^COMPARATOR$"
    - "^TARGET$"
    - "^LIGHTNING_ROD$"
    - "^LEVER$"
    - "^.*_BUTTON$"
    - "^.*_PRESSURE_PLATE$"
    - "^.*_RAIL$"
    - "^TRIPWIRE$"
    - "^TRIPWIRE_HOOK$"
    - "^.*_DOOR$"            # 门是两格方块，破坏/掉落规则特殊，不收
    - "^.*_SIGN$"            # 告示牌破坏走实体掉落，容易重复掉落，不收
    - "^.*_HANGING_SIGN$"
    - "^.*_BED$"
    - "^.*COMMAND_BLOCK$"    # 命令方块
    - "^LEGACY_.*"           # 老版本遗留的废弃材料
    - "^.*_TORCH$"
    - "^SOUL_TORCH$"
    - "^FIRE$"
    - "^SOUL_FIRE$"
    - "^CAMPFIRE$"
    - "^SOUL_CAMPFIRE$"
    - "^WATER$"              # 液体
    - "^LAVA$"
    - "^SPONGE$"
    - "^WET_SPONGE$"
    - "^HONEY_BLOCK$"
    - "^SLIME_BLOCK$"        # 粘性/特殊行为方块
    - "^SCAFFOLDING$"
    - "^STRUCTURE_BLOCK$"
    - "^JIGSAW_BLOCK$"
    - "^BARRIER$"
    - "^LIGHT$"
    - "^STRUCTURE_VOID$"
    - "^END_PORTAL$"
    - "^END_GATE$"
    - "^END_PORTAL_FRAME$"
    - "^DRAGON_EGG$"
    - "^.*_ORE$"             # 矿石与粗金属（不是建材）
    - "^RAW_.*"
    - "^.*_SHROOM$"          # 作物与植物
    - "^.*_FUNGUS$"
    - "^.*_SPROUT$"
    - "^SPORE_BLOSSOM$"
    - "^.*_PROPAGULE$"
    - "^.*_MUSHROOM.*"       # 蘑菇方块/蘑菇杆
    - "^MUSHROOM_STEM$"
    - "^.*_DRIPLEAF.*"
    - "^DRIED_KELP_BLOCK$"
    - "^.*_LEAVES$"
    - "^.*_SAPLING$"
    - "^POTTED_.*"
    - "^AZALEA.*"
    - "^.*_ROOTS$"
    - "^.*_CORAL$"
    - "^CORAL_BLOCK$"
    - "^.*_CORAL_BLOCK$"
    - "^.*_FAN$"
    - "^.*_GRASS$"
    - "^.*_FERN$"
    - "^.*_SHRUB$"
    - "^.*_BUSH$"
    - "^.*_PETALS$"
    - "^WHEAT$"
    - "^CARROTS$"
    - "^POTATOES$"
    - "^BEETROOTS$"
    - "^PUMPKIN_STEM$"
    - "^MELON_STEM$"
    - "^ATTACHED_.*"         # 挂在方块上的瓜藤
    - "^PUMPKIN$"
    - "^CARVED_PUMPKIN$"
    - "^MELON$"
    - "^SUGAR_CANE$"
    - "^CACTUS$"
    - "^BAMBOO$"
    - "^BAMBOO_SPROUT$"
    - "^CHORUS_.*"
    - "^FROGSPAWN$"

  # 常见建筑方块（按类别分组；GUI 就按这个顺序排，新版本没写到的同类方块会自动补进「自动发现」）
  categories:
    "石头与地形":
      - STONE
      - COBBLESTONE
      - MOSSY_COBBLESTONE
      - STONE_BRICKS
      - MOSSY_STONE_BRICKS
      - GRANITE
      - POLISHED_GRANITE
      - DIORITE
      - POLISHED_DIORITE
      - ANDESITE
      - POLISHED_ANDESITE
      - DEEPSLATE
      - COBBLED_DEEPSLATE
      - POLISHED_DEEPSLATE
      - DEEPSLATE_BRICKS
      - DEEPSLATE_TILES
      - TUFF
      - CALCITE
      - SAND
      - SANDSTONE
      - SMOOTH_SANDSTONE
      - RED_SANDSTONE
      - SMOOTH_RED_SANDSTONE
      - GRAVEL
      - DIRT
      - COARSE_DIRT
      - ROOTED_DIRT
      - GRASS_BLOCK
      - MUD
      - PACKED_MUD
      - MUD_BRICKS
      - CLAY
      - SNOW_BLOCK
      - ICE
      - PACKED_ICE
      - BLUE_ICE
      - MAGMA_BLOCK
    "木板与木质":
      - OAK_PLANKS
      - OAK_LOG
      - STRIPPED_OAK_LOG
      - OAK_WOOD
      - OAK_STAIRS
      - OAK_SLAB
      - OAK_FENCE
      - OAK_FENCE_GATE
      - OAK_TRAPDOOR
      - SPRUCE_PLANKS
      - SPRUCE_LOG
      - STRIPPED_SPRUCE_LOG
      - SPRUCE_STAIRS
      - SPRUCE_SLAB
      - SPRUCE_FENCE
      - BIRCH_PLANKS
      - BIRCH_LOG
      - BIRCH_STAIRS
      - BIRCH_SLAB
      - JUNGLE_PLANKS
      - JUNGLE_LOG
      - JUNGLE_STAIRS
      - ACACIA_PLANKS
      - ACACIA_LOG
      - ACACIA_STAIRS
      - DARK_OAK_PLANKS
      - DARK_OAK_LOG
      - DARK_OAK_STAIRS
      - MANGROVE_PLANKS
      - MANGROVE_LOG
      - CHERRY_PLANKS
      - CHERRY_LOG
      - CHERRY_STAIRS
      - BAMBOO_PLANKS
      - BAMBOO_STAIRS
    "砖瓦与装饰":
      - BRICKS
      - QUARTZ_BLOCK
      - QUARTZ_PILLAR
      - SMOOTH_QUARTZ
      - QUARTZ_STAIRS
      - PURPUR_BLOCK
      - PURPUR_PILLAR
      - PURPUR_STAIRS
      - PRISMARINE
      - PRISMARINE_BRICKS
      - PRISMARINE_STAIRS
      - SEA_LANTERN
      - BONE_BLOCK
      - GLOWSTONE
      - OBSIDIAN
      - CUT_COPPER
      - CUT_COPPER_STAIRS
      - CUT_COPPER_SLAB
      - EXPOSED_COPPER
      - WEATHERED_COPPER
      - OXIDIZED_COPPER
      - COPPER_BLOCK
    "金属与矿物块":
      - IRON_BLOCK
      - GOLD_BLOCK
      - DIAMOND_BLOCK
      - EMERALD_BLOCK
      - LAPIS_BLOCK
      - REDSTONE_BLOCK
      - NETHERITE_BLOCK
      - COPPER_BLOCK
    "陶瓦·玻璃·羊毛·混凝土":
      - GLASS
      - GLASS_PANE
      - WHITE_TERRACOTTA
      - WHITE_WOOL
      - WHITE_CARPET
      - WHITE_CONCRETE
      - MOSS_BLOCK
      - MOSS_CARPET
    "下界与末地":
      - NETHERRACK
      - SOUL_SAND
      - SOUL_SOIL
      - NETHER_BRICKS
      - RED_NETHER_BRICKS
      - WARPED_STEM
      - CRIMSON_STEM
      - WARPED_HYPHAE
      - CRIMSON_HYPHAE
      - WARPED_PLANKS
      - CRIMSON_PLANKS
      - END_STONE
      - END_STONE_BRICKS
      - END_STONE_BRICK_STAIRS
    "植物类建材":
      - MOSS_BLOCK
      - MOSS_CARPET
      - BAMBOO_BLOCK
      - BAMBOO_MOSAIC
      - RESIN_BLOCK
      - RESIN_BRICKS

# ------------------------------------------------------------------
# 自定义方块中文名（优先级最高；目录里没翻出来的名字在这里补一条就行）
# ------------------------------------------------------------------
custom-block-translations:
  COBBLESTONE: "圆石"
  MOSSY_COBBLESTONE: "苔藓圆石"
  DEEPSLATE_TILES: "深板岩瓦"
  NETHERRACK: "地狱岩"
  END_STONE: "末地石"
  GLOWSTONE: "荧石"
  OBSIDIAN: "黑曜石"
  PACKED_ICE: "浮冰"
  BLUE_ICE: "蓝冰"
  SNOW_BLOCK: "雪块"
  CLAY: "黏土块"
  MOSS_BLOCK: "苔藓块"
  MOSS_CARPET: "苔藓地毯"
  CUT_COPPER: "切制铜块"
  PRISMARINE_BRICKS: "海晶石砖"
  PURPUR_BLOCK: "紫珀块"
  MUD_BRICKS: "泥砖"
  NETHERITE_BLOCK: "下界合金块"
  RESIN_BRICKS: "树脂砖"
  OXIDIZED_COPPER: "氧化的铜块"

# ------------------------------------------------------------------
# 次数与绑定
# ------------------------------------------------------------------
default-uses: 50
max-uses-limit: 100000
enable-binding-system: true
allow-use-bound-blocks: false
allow-break-bound-blocks: false
blacklisted-worlds: []
# 次数用尽后：convert = 变成普通方块物品（推荐），delete = 直接消失
depleted-action: convert
return-item-on-break: true
drop-on-explosion: true
# 活塞推魔法方块：cancel = 不许推（推荐，防止方块被推走导致身份丢失），forget = 推走就忘掉记录
piston-behavior: cancel
protect-from-fluid: true
protect-from-growth: true
protect-from-burn: true
protect-from-physics: true

# ------------------------------------------------------------------
# 物品显示
# ------------------------------------------------------------------
display:
  block-name-format: "&b✦ %s ✦"
  show-info:
    bound-player: true
    usage-count: true
    progress-bar: true
  decorative-lore:
    enabled: false
    lines:
      - "&8✦ 用掉 %uses% 次，还剩 %remaining% 次 ✦"
  progress-bar-length: 10

# ------------------------------------------------------------------
# GUI
# ------------------------------------------------------------------
gui:
  title: "&8⚡ &b魔法方块选择 &8（建筑方块）"
  rows: 6
  buttons:
    previous-page:
      material: ARROW
      name: "&a上一页"
      lore:
        - "&7翻到上一页"
      slot: 45
      disabled-material: GRAY_DYE
      disabled-name: "&c没有上一页"
    page-info:
      material: PAPER
      name: "&f第 %page% 页"
      lore:
        - "&7点击查看页码"
      slot: 46
      disabled-material: PAPER
      disabled-name: "&f页码"
    next-page:
      material: ARROW
      name: "&a下一页"
      lore:
        - "&7翻到下一页"
      slot: 47
      disabled-material: GRAY_DYE
      disabled-name: "&c没有下一页"
    close:
      material: BARRIER
      name: "&c关闭"
      lore:
        - "&7关闭界面"
      slot: 53
      disabled-material: BARRIER
      disabled-name: "&c关闭"
  # 手动追加的材料（归类到「手动追加」；建筑目录之外还想给什么方块就写在这里）
  materials: []
  # 手动追加的分组材料
  group: {}

# 单个材料的默认次数（覆盖 default-uses）
material-uses:
  OBSIDIAN: 20
  NETHERITE_BLOCK: 10

# ------------------------------------------------------------------
# 存储
# ------------------------------------------------------------------
storage:
  save-interval-seconds: 5
  save-on-disable: true
  validate-on-startup: false

# ------------------------------------------------------------------
# 其它开关
# ------------------------------------------------------------------
debug-mode: false
log-usage: false
enable-statistics: true
check-updates: false
update-check-owner: niubikelashi
update-check-repo: MagicBlockPlus
self-test: false

# ------------------------------------------------------------------
# 消息（zh_CN 全量汉化；en 保留一份给英文服务器）
